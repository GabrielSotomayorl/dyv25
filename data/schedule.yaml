lessons:
  - title: 'Descripción y Visualización de Datos'
    header: True

  - title: '<span class="content-title">Unidad 1. Introducción a la estadística y su relación con las ciencias sociales</span>'
    date: "11 - 18 de agosto"
    date_start: "11 agosto"
    date_end: "18 agosto"
    bg: 1

  - title: '• Presentación del curso<br>• El proceso de conocimiento científico: lógica inductiva y deductiva<br>• Etapas generales de la investigación social empírica<br>• Datos: la fuente de información clave para la estadística<br>• La estadística como una aproximación a preguntas de investigación sociológicas.'
    session: "Sesión 1"
    date: "11 agosto"
    bg: 1

  - title: '• Usos de la estadística en la actualidad: sociología, políticas públicas, otros.<br>• La relevancia de los lenguajes de programación para el análisis estadístico actual.<br>• <strong>Evaluación: Control N°1</strong>'
    session: "Sesión 2"
    date: "18 agosto"
    bg: 1
    bottomborder: True

  - title: '<span class="content-title">Unidad 2. Conceptos claves para la investigación social</span>'
    date: "25 de agosto - 1 de septiembre"
    date_start: "25 agosto"
    date_end: "1 septiembre"
    bg: 2

  - title: '• Conceptualización y operacionalización.<br>• Unidad de análisis vs unidad de observación.<br>• Tipos de variables y niveles de medición.'
    session: "Sesión 3"
    date: "25 agosto"
    bg: 2

  - title: '• Muestra y población: estadísticas muestrales y parámetros poblacionales.<br>• Población objetivo, marco muestral, muestra.<br>• Validez y confiabilidad en la medición.<br>• Error de medición y error muestral.<br>• <strong>Evaluaciones: Control N°2, Entrega Tarea 1</strong>'
    session: "Sesión 4"
    date: "1 septiembre"
    bg: 2
    bottomborder: True

  - title: '<span class="content-title">Unidad 3. Marcos de datos para la investigación social</span>'
    date: "8 - 29 de septiembre"
    date_start: "8 septiembre"
    date_end: "29 septiembre"
    bg: 1

  - title: '• Estructura de una tabla de datos: lógica filas, columnas.<br>• Exploración de una tabla de datos en R.<br>• Tipos de variables en una tabla de datos.<br>• <strong>Inicio: Trabajo Práctico 1 (3 semanas)</strong>'
    session: "Sesión 5"
    date: "8 septiembre"
    bg: 1

  - title: '<strong>• SEMANA DE RECESO POR FIESTAS PATRIAS</strong>'
    session: ""
    date: "15 septiembre"
    bg: 1

  - title: '• Manipulación de tablas de datos I: selecciones, filtros, ordenamiento.<br>• Manipulación de tablas de datos II: uniones y pivot.'
    session: "Sesión 6"
    date: "22 septiembre"
    bg: 1

  - title: '• Recodificación de variables: uso de estructuras condicionales.<br>• Construcción de variables: índices, escalas y tipologías.<br>• <strong>Evaluación: Control N°3</strong>'
    session: "Sesión 7"
    date: "29 septiembre"
    bg: 1
    bottomborder: True

  - title: '<strong>• SOLEMNE 1 – Contenido Unidades 1, 2 y 3</strong>'
    session: "Evaluación"
    date: "6 octubre"
    bg: 2
    bottomborder: True

  - title: '<span class="content-title">Unidad 4. Estadística Descriptiva Univariada</span>'
    date: "13 de octubre - 3 de noviembre"
    date_start: "13 octubre"
    date_end: "3 noviembre"
    bg: 1

  - title: '• Estadísticos de centro: media, mediana, moda.<br>• Estadísticos de dispersión: rango, varianza, desviación estándar.<br>• Posición: percentiles.<br>• <strong>Entrega Tarea 2</strong>'
    session: "Sesión 8"
    date: "13 octubre"
    bg: 1

  - title: '• Forma: asimetría y curtosis.<br>• Frecuencias absolutas y relativas. Porcentajes. Tasas.'
    session: "Sesión 9"
    date: "20 octubre"
    bg: 1

  - title: '• Visualización de datos: barras, histogramas y boxplots.<br>• Recomendaciones para la visualización de datos cuantitativos.<br>• <strong>Entrega Tarea 3</strong>'
    session: "Sesión 10"
    date: "27 octubre"
    bg: 1
    
  - title: '• Introducción a la gramática de gráficos de ggplot2.<br>• <strong>Evaluaciones: Control N°4, Inicio Trabajo Práctico 2</strong>'
    session: "Sesión 11"
    date: "3 noviembre"
    bg: 1
    bottomborder: True

  - title: '<span class="content-title">Unidad 5. Estadística Descriptiva Bivariada</span>'
    date: "10 - 24 de noviembre"
    date_start: "10 noviembre"
    date_end: "24 noviembre"
    bg: 2

  - title: '• Tipos de asociaciones entre variables según su naturaleza.<br>• Concepto de independencia.<br>• Construcción de estadísticos por grupo.'
    session: "Sesión 12"
    date: "10 noviembre"
    bg: 2

  - title: '• Construcción de tablas de contingencia.<br>• Control por tercera variable.<br>• <strong>Entrega Tarea 4</strong>'
    session: "Sesión 13"
    date: "17 noviembre"
    bg: 2

  - title: '• Visualizaciones bivariadas: barras, histogramas y boxplots.<br>• <strong>Evaluación: Control N°5</strong>'
    session: "Sesión 14"
    date: "24 noviembre"
    bg: 2
    bottomborder: True

  - title: '<span class="content-title">Cierre del Curso y Evaluaciones Finales</span>'
