  - title: '• Medidas de asociación: Pearson, spearman, gamma.<br>• Más allá de lo descriptivo: la probabilidad como medida de incertidumbre.<br>• Recomendaciones para la visualización de datos cuantitativos.<br>• <strong>SOLEMNE II – Contenido Unidades 4 y 5</strong>'
    session: "Evaluación Final"
    date: "1 diciembre"
    bg: 1
    bottomborder: True
    
